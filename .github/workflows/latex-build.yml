name: Build LaTeX Documentation with DevOps Metrics

on:
  push:
    branches: [ main ]
    paths:
      - 'Book_SSW590_1/**'
      - '.github/workflows/latex-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-latex:
    name: Compile LaTeX and Generate Documentation
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version information
        id: version-info
        shell: bash
        run: |
          # Generate version based on commit count
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="1.0.${COMMIT_COUNT}"
          
          # Get current commit information
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_FULL_SHA=$(git rev-parse HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          COMMIT_DATE=$(git log -1 --pretty=%ai)
          
          # Create version file for LaTeX
          echo "v${VERSION} (Commit: ${COMMIT_SHA})" > Book_SSW590_1/version.txt
          
          # Create build timestamp file
          date "+%Y-%m-%d %H:%M:%S" > Book_SSW590_1/build-timestamp.txt
          
          # Create commit info file
          cat > Book_SSW590_1/commit-info.txt << EOF
          Commit SHA: ${COMMIT_FULL_SHA}
          Short SHA: ${COMMIT_SHA}
          Author: ${COMMIT_AUTHOR}
          Date: ${COMMIT_DATE}
          Message: ${COMMIT_MESSAGE}
          EOF
          
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "COMMIT_FULL_SHA=${COMMIT_FULL_SHA}" >> $GITHUB_OUTPUT

      - name: Capture Build Metrics - Start
        id: metrics-start
        shell: bash
        run: |
          # Capture basic system metrics
          cat > Book_SSW590_1/build-metrics-start.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "cpu_cores": $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "unknown"),
            "total_memory_gb": $(free -g 2>/dev/null | awk 'NR==2 {print $2}' || echo "unknown")
          }
          EOF

      - name: Setup LaTeX environment
        shell: bash
        run: |
          # Check if LaTeX is available
          if command -v pdflatex &> /dev/null; then
            echo "✓ pdflatex found"
            pdflatex --version | head -1
          else
            echo "⚠ LaTeX not found in PATH"
          fi

      - name: Compile LaTeX document
        id: latex-compile
        shell: bash
        run: |
          cd Book_SSW590_1
          
          echo "=== Starting LaTeX Compilation ==="
          echo "Document: itManual.tex"
          echo "Compile Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          
          # Try to compile with pdflatex
          if command -v pdflatex &> /dev/null; then
            echo "Running: pdflatex -interaction=nonstopmode -shell-escape itManual.tex"
            pdflatex -interaction=nonstopmode -shell-escape itManual.tex 2>&1 | tee build.log
            
            exitCode=${PIPESTATUS[0]}
            if [ $exitCode -eq 0 ]; then
              echo "✓ LaTeX compilation successful"
              echo "status=success" >> $GITHUB_OUTPUT
              
              # Run bibtex if needed
              if command -v bibtex &> /dev/null; then
                echo "Running bibtex for bibliography..."
                bibtex itManual 2>&1 | tee -a build.log
              fi
              
              # Run makeindex for glossary
              if command -v makeindex &> /dev/null; then
                echo "Running makeindex for index..."
                makeindex itManual 2>&1 | tee -a build.log
              fi
              
              # Final compilation pass
              echo "Final LaTeX pass..."
              pdflatex -interaction=nonstopmode -shell-escape itManual.tex 2>&1 | tee -a build.log
            else
              echo "✗ LaTeX compilation failed with exit code: $exitCode"
              echo "status=failed" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "⚠ pdflatex not found, skipping compilation"
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi

      - name: Verify output artifacts
        shell: bash
        run: |
          cd Book_SSW590_1
          
          echo "=== Checking LaTeX Output Artifacts ==="
          echo ""
          
          if [ -f "itManual.pdf" ]; then
            fileSize=$(du -h itManual.pdf | cut -f1)
            echo "✓ PDF generated successfully"
            echo "  File: itManual.pdf"
            echo "  Size: $fileSize"
            echo "  Generated: $(ls -l itManual.pdf | awk '{print $6, $7, $8}')"
          else
            echo "✗ PDF not found"
          fi
          
          echo ""
          echo "Auxiliary files created:"
          ls -1 *.aux *.log *.out 2>/dev/null | sed 's/^/  - /'

      - name: Generate DevOps Metrics Report
        shell: bash
        run: |
          cd Book_SSW590_1
          
          cat > BUILD_REPORT.md << 'EOF'
          # DevOps Build Report
          
          ## Build Information
          - **Version**: v${{ steps.version-info.outputs.VERSION }}
          - **Commit SHA**: ${{ steps.version-info.outputs.COMMIT_SHA }}
          - **Full SHA**: ${{ steps.version-info.outputs.COMMIT_FULL_SHA }}
          - **Timestamp**: $(date '+%Y-%m-%d %H:%M:%S')
          
          ## Workflow Execution
          - **Run ID**: ${{ github.run_id }}
          - **Run Number**: ${{ github.run_number }}
          - **Trigger**: ${{ github.event_name }}
          - **Branch**: ${{ github.ref_name }}
          
          ## LaTeX Compilation
          - **Status**: ${{ steps.latex-compile.outputs.status }}
          - **Document**: itManual.tex
          - **Output**: itManual.pdf
          
          ## System Environment
          - **Runner**: ${{ runner.os }}
          - **Runner Type**: Self-Hosted
          - **GitHub Actions Version**: ${{ github.action }}
          
          ## Generated Artifacts
          - version.txt
          - build-timestamp.txt
          - commit-info.txt
          - build-metrics-start.json
          EOF
          
          cat BUILD_REPORT.md

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Stage the generated files
          git add Book_SSW590_1/version.txt Book_SSW590_1/build-timestamp.txt Book_SSW590_1/commit-info.txt -f 2>/dev/null || true
          
          # Check if there are changes to commit
          if git status --porcelain | grep -q "Book_SSW590_1"; then
            echo "Committing generated metadata files..."
            git commit -m "docs: update LaTeX metadata and build information [skip ci]" --allow-empty 2>/dev/null || true
            git push origin main 2>/dev/null || echo "⚠ Push failed or not needed"
          else
            echo "No changes to commit"
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: devops-documentation-${{ steps.version-info.outputs.VERSION }}
          path: Book_SSW590_1/itManual.pdf
          retention-days: 90

      - name: Create Release with PDF
        uses: softprops/action-gh-release@v1
        if: success() && hashFiles('Book_SSW590_1/itManual.pdf') != ''
        with:
          files: Book_SSW590_1/itManual.pdf
          tag_name: docs-v${{ steps.version-info.outputs.VERSION }}
          name: Documentation Release v${{ steps.version-info.outputs.VERSION }}
          body: |
            ## DevOps Documentation Build
            
            **Version**: v${{ steps.version-info.outputs.VERSION }}
            **Commit**: ${{ steps.version-info.outputs.COMMIT_SHA }}
            
            ### Included Content
            - All project chapters and documentation
            - Updated Project Demo chapter with build information
            - System metrics and deployment information
            - Complete bibliography and index
            
            ### Build Details
            - **Compiled**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Trigger Branch**: ${{ github.ref_name }}
            - **PDF Status**: ✅ Successfully generated
            
            This PDF contains the complete DevOps project documentation with the latest commit information and system metrics.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display Summary
        shell: bash
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "  LaTeX Build & Documentation Workflow Completed"
          echo "════════════════════════════════════════════════════════"
          echo ""
          echo "Build Summary:"
          echo "  Version:      v${{ steps.version-info.outputs.VERSION }}"
          echo "  Commit:       ${{ steps.version-info.outputs.COMMIT_SHA }}"
          echo "  Status:       ${{ steps.latex-compile.outputs.status }}"
          echo "  Timestamp:    $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          echo "Generated Files:"
          echo "  ✓ Book_SSW590_1/version.txt"
          echo "  ✓ Book_SSW590_1/build-timestamp.txt"
          echo "  ✓ Book_SSW590_1/commit-info.txt"
          echo ""
          echo "Next Steps:"
          echo "  1. Check GitHub Artifacts for compiled PDF"
          echo "  2. Review commit information in itProjectDemo chapter"
          echo "  3. Visit GitHub Releases for documentation releases"
          echo ""
          echo "════════════════════════════════════════════════════════"
