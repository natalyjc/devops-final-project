name: Build LaTeX Document and Generate PDF

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Book_SSW590_1/**'
      - '.github/workflows/build-latex.yml'
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git operations
      
      - name: Set up Git
        run: |
          git config --global user.email "devops@example.com"
          git config --global user.name "DevOps Automation"
      
      - name: Generate version and build information
        run: |
          cd Book_SSW590_1
          
          # Get version information
          VERSION=$(git describe --tags --always 2>/dev/null || echo "0.1.0")
          VERSION=$(echo $VERSION | sed 's/^v//')
          
          # Get commit info
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          AUTHOR=$(git log -1 --pretty=%an)
          TIMESTAMP=$(git log -1 --pretty=%ai)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          
          # Write version file
          echo "$VERSION" > version.txt
          
          # Write build info LaTeX file
          cat > buildinfo.tex << 'LATEX'
          % Auto-generated build information
          % This file is automatically generated on each build
          
          \newcommand{\buildversion}{VERSION_PLACEHOLDER}
          \newcommand{\commitHash}{COMMIT_HASH_PLACEHOLDER}
          \newcommand{\commitMessage}{COMMIT_MESSAGE_PLACEHOLDER}
          \newcommand{\authorName}{AUTHOR_PLACEHOLDER}
          \newcommand{\buildTimestamp}{TIMESTAMP_PLACEHOLDER}
          \newcommand{\branchName}{BRANCH_PLACEHOLDER}
          \newcommand{\totalCommits}{COMMIT_COUNT_PLACEHOLDER}
          LATEX
          
          # Replace placeholders (using | as delimiter to handle / in messages)
          sed -i "s|VERSION_PLACEHOLDER|$VERSION|g" buildinfo.tex
          sed -i "s|COMMIT_HASH_PLACEHOLDER|$COMMIT_HASH|g" buildinfo.tex
          # Escape special LaTeX characters in commit message
          SAFE_MESSAGE=$(echo "$COMMIT_MESSAGE" | sed 's/[\/&]/\\&/g' | sed 's/$/\\/' | tr '\n' ' ')
          sed -i "s|COMMIT_MESSAGE_PLACEHOLDER|${SAFE_MESSAGE}|g" buildinfo.tex
          sed -i "s|AUTHOR_PLACEHOLDER|$AUTHOR|g" buildinfo.tex
          sed -i "s|TIMESTAMP_PLACEHOLDER|$TIMESTAMP|g" buildinfo.tex
          sed -i "s|BRANCH_PLACEHOLDER|$BRANCH|g" buildinfo.tex
          sed -i "s|COMMIT_COUNT_PLACEHOLDER|$COMMIT_COUNT|g" buildinfo.tex
          
          echo "Version: $VERSION"
          echo "Commit: $COMMIT_HASH"
          echo "Author: $AUTHOR"
          echo "Branch: $BRANCH"
      
      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science
      
      - name: Compile LaTeX to PDF
        run: |
          cd Book_SSW590_1
          
          # Run pdflatex multiple times for references and TOC
          echo "First pass: generating references..."
          pdflatex -interaction=nonstopmode -output-directory=. itManual.tex > build.log 2>&1 || true
          
          echo "Second pass: building table of contents..."
          pdflatex -interaction=nonstopmode -output-directory=. itManual.tex > build.log 2>&1 || true
          
          echo "Third pass: final compilation..."
          pdflatex -interaction=nonstopmode -output-directory=. itManual.tex > build.log 2>&1 || true
          
          # Check if PDF was created
          if [ -f itManual.pdf ]; then
              echo "✓ PDF generated successfully: itManual.pdf"
          else
              echo "✗ PDF generation failed"
              tail -50 build.log
              exit 1
          fi
      
      - name: Check build log for errors
        if: always()
        run: |
          cd Book_SSW590_1
          
          if grep -i "error\|undefined\|emergency stop" build.log; then
              echo "⚠ Warnings or errors found in build log (not critical)"
          else
              echo "✓ No critical errors in build log"
          fi
      
      - name: Generate build metadata JSON
        run: |
          cat > buildinfo.json << 'JSON'
          {
            "version": "$(cat Book_SSW590_1/version.txt)",
            "commitHash": "$(git rev-parse --short HEAD)",
            "commitMessage": "$(git log -1 --pretty=%B | head -1)",
            "author": "$(git log -1 --pretty=%an)",
            "timestamp": "$(git log -1 --pretty=%ai)",
            "branch": "$(git rev-parse --abbrev-ref HEAD)",
            "totalCommits": $(git rev-list --count HEAD),
            "buildDate": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "pdfPath": "Book_SSW590_1/itManual.pdf",
            "repository": "${{ github.repository }}",
            "workflowRun": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
          
          cat buildinfo.json
      
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaTeX-PDF-${{ github.run_id }}
          path: Book_SSW590_1/itManual.pdf
          retention-days: 30
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build-Metadata-${{ github.run_id }}
          path: |
            buildinfo.json
            Book_SSW590_1/version.txt
            Book_SSW590_1/buildinfo.tex
          retention-days: 30
      
      - name: Create Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Book_SSW590_1/itManual.pdf
            buildinfo.json
          body_path: COMPLETION_SUMMARY.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Commit version updates (if changed)
        if: always()
        run: |
          cd ${{ github.workspace }}
          
          git add Book_SSW590_1/version.txt Book_SSW590_1/buildinfo.tex buildinfo.json 2>/dev/null || true
          
          if git diff --cached --quiet; then
              echo "No changes to commit"
          else
              git commit -m "ci: auto-update version and build info [skip ci]" || true
              git push origin ${{ github.ref_name }} || true
          fi
        continue-on-error: true
      
      - name: Summary
        if: always()
        run: |
          echo "Build Summary"
          echo "=============="
          echo "Version: $(cat Book_SSW590_1/version.txt)"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "PDF Location: Book_SSW590_1/itManual.pdf"
          echo ""
          echo "View the PDF in the artifacts section above"
