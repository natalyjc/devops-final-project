name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  VERSION_MAJOR: 1
  VERSION_MINOR: 0

jobs:
  build:
    name: Build & Package
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - name: Show commit info
        run: |
          echo "Commit SHA: $GITHUB_SHA"
          echo "Commit Message:"
          git log -1 --pretty=%B
      
      - name: System Load - Before Build
        run: |
          echo "=== SYSTEM METRICS - START ==="
          echo "CPU Usage:"
          top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{print "CPU Load: " 100 - $1 "%"}'
          echo ""
          echo "Memory Usage:"
          free -h | awk 'NR==2{print "Used: " $3 " / Total: " $2}'
          echo ""
          echo "Disk Usage:"
          df -h / | awk 'NR==2{print "Used: " $3 " / Total: " $2 " (" $5 ")"}'
          echo ""
          echo "Load Average:"
          uptime
          echo ""

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.email "devops@example.com"
          git config --global user.name "DevOps Automation"

      - name: Show project structure
        run: |
          echo "=== Project Structure ==="
          ls -la
          echo ""
          echo "=== Asset Files ==="
          find . -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \) | head -20

      - name: Generate semantic version
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${COMMIT_COUNT}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Building project source code 
        id: package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PACKAGE_NAME="devops-final-project-${VERSION}"
          
          echo "=== Files to package ==="
          ls -lh *.html *.css *.js 2>/dev/null | grep -v node_modules || true
          
          zip -r "${PACKAGE_NAME}.zip" \
            index.html \
            style.css \
            demo.js \
            README.md \
            -x "node_modules/*"
          
          ls -lh "${PACKAGE_NAME}.zip"
          echo "artifact-name=${PACKAGE_NAME}.zip" >> $GITHUB_OUTPUT

      - name: System Load - During Build
        run: |
          echo "=== SYSTEM METRICS - MID BUILD ==="
          echo "Memory Usage:"
          free -h | awk 'NR==2{print "Used: " $3 " / Total: " $2}'
          ps aux --sort=-%mem | head -6

  build-latex:
    name: Build LaTeX Document
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.email "devops@example.com"
          git config --global user.name "DevOps Automation"
      
      - name: Generate version and build information
        run: |
          cd Book_SSW590_1
          
          # Get version information
          VERSION=$(git describe --tags --always 2>/dev/null || echo "0.1.0")
          VERSION=$(echo $VERSION | sed 's/^v//')
          
          # Get commit info
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          AUTHOR=$(git log -1 --pretty=%an)
          TIMESTAMP=$(git log -1 --pretty=%ai)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          
          # Write version file
          echo "$VERSION" > version.txt
          
          # Write build info LaTeX file
          cat > buildinfo.tex << 'LATEX'
          % Auto-generated build information
          % This file is automatically generated on each build
          
          \newcommand{\buildversion}{VERSION_PLACEHOLDER}
          \newcommand{\commitHash}{COMMIT_HASH_PLACEHOLDER}
          \newcommand{\commitMessage}{COMMIT_MESSAGE_PLACEHOLDER}
          \newcommand{\authorName}{AUTHOR_PLACEHOLDER}
          \newcommand{\buildTimestamp}{TIMESTAMP_PLACEHOLDER}
          \newcommand{\branchName}{BRANCH_PLACEHOLDER}
          \newcommand{\totalCommits}{COMMIT_COUNT_PLACEHOLDER}
          LATEX
          
          # Replace placeholders (using | as delimiter to handle / in messages)
          sed -i "s|VERSION_PLACEHOLDER|$VERSION|g" buildinfo.tex
          sed -i "s|COMMIT_HASH_PLACEHOLDER|$COMMIT_HASH|g" buildinfo.tex
          # Escape special LaTeX characters in commit message
          SAFE_MESSAGE=$(echo "$COMMIT_MESSAGE" | sed 's/[\/&]/\\&/g' | sed 's/$/\\/' | tr '\n' ' ')
          sed -i "s|COMMIT_MESSAGE_PLACEHOLDER|${SAFE_MESSAGE}|g" buildinfo.tex
          sed -i "s|AUTHOR_PLACEHOLDER|$AUTHOR|g" buildinfo.tex
          sed -i "s|TIMESTAMP_PLACEHOLDER|$TIMESTAMP|g" buildinfo.tex
          sed -i "s|BRANCH_PLACEHOLDER|$BRANCH|g" buildinfo.tex
          sed -i "s|COMMIT_COUNT_PLACEHOLDER|$COMMIT_COUNT|g" buildinfo.tex
          
          echo "Version: $VERSION"
          echo "Commit: $COMMIT_HASH"
          echo "Author: $AUTHOR"
          echo "Branch: $BRANCH"
      
      - name: Generate reverse architecture documentation
        run: |
          echo "=== GENERATING REVERSE ARCHITECTURE DOCUMENTATION ==="
          
          # Create architecture directory
          mkdir -p Book_SSW590_1/architecture
          
          # Install tools
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz > /dev/null 2>&1
          
          # Generate PlantUML architecture diagram
          cat > Book_SSW590_1/architecture/architecture.puml << 'PLANTUML'
          @startuml devops-architecture
          !theme plain
          title DevOps Final Project - Architecture Overview
          
          package "Frontend" {
            [index.html] as HTML
            [style.css] as CSS
            [demo.js] as JS
          }
          
          package "LaTeX Documentation" {
            [itManual.tex] as LATEX
            [itProjectDemo.tex] as DEMO
            [Cornell Style] as STYLE
          }
          
          package "CI/CD Pipeline" {
            [ci-cd.yml] as CI_CD
            [GitHub Actions] as ACTIONS
          }
          
          package "Build Output" {
            [itManual.pdf] as PDF
            [version.txt] as VERSION
            [buildinfo.json] as METADATA
          }
          
          HTML --> CSS : styles
          HTML --> JS : interaction
          LATEX --> DEMO : includes
          DEMO --> |references| METADATA
          CI_CD --> ACTIONS : runs
          ACTIONS --> PDF : generates
          ACTIONS --> METADATA : creates
          
          @enduml
          PLANTUML
          
          # Generate Graphviz diagram
          cat > Book_SSW590_1/architecture/architecture.dot << 'GRAPHVIZ'
          digraph DevOpsArchitecture {
              rankdir=LR;
              node [shape=box, style=rounded];
              
              subgraph cluster_frontend {
                  label = "Frontend Layer";
                  style = "rounded,filled";
                  fillcolor = "lightblue";
                  HTML [label="index.html\n(Web Interface)"];
                  CSS [label="style.css\n(Styling)"];
                  JS [label="demo.js\n(Interaction)"];
              }
              
              subgraph cluster_docs {
                  label = "Documentation Layer";
                  style = "rounded,filled";
                  fillcolor = "lightgreen";
                  MAIN_TEX [label="itManual.tex\n(Main Document)"];
                  DEMO_TEX [label="itProjectDemo.tex\n(DevOps Chapter)"];
                  ARCH_TEX [label="itArchitecture.tex\n(Architecture)"];
              }
              
              subgraph cluster_cicd {
                  label = "CI/CD Pipeline";
                  style = "rounded,filled";
                  fillcolor = "lightyellow";
                  CI_CD [label="ci-cd.yml"];
                  ACTIONS [label="GitHub Actions"];
              }
              
              subgraph cluster_output {
                  label = "Build Output";
                  style = "rounded,filled";
                  fillcolor = "lightcoral";
                  PDF [label="itManual.pdf\n(Generated)"];
                  VERSION [label="version.txt"];
                  METADATA [label="buildinfo.json"];
              }
              
              HTML -> CSS [label="uses"];
              HTML -> JS [label="uses"];
              MAIN_TEX -> DEMO_TEX [label="includes"];
              MAIN_TEX -> ARCH_TEX [label="includes"];
              DEMO_TEX -> METADATA [label="references"];
              CI_CD -> ACTIONS [label="orchestrates"];
              ACTIONS -> MAIN_TEX [label="compiles"];
              ACTIONS -> METADATA [label="generates"];
              MAIN_TEX -> PDF [label="pdflatex"];
              METADATA -> PDF [label="inputs"];
              VERSION -> PDF [label="inputs"];
          }
          GRAPHVIZ
          
          # Convert Graphviz to PNG and PDF
          dot -Tpng Book_SSW590_1/architecture/architecture.dot -o Book_SSW590_1/architecture/architecture.png 2>/dev/null || true
          dot -Tpdf Book_SSW590_1/architecture/architecture.dot -o Book_SSW590_1/architecture/architecture.pdf 2>/dev/null || true
          
          echo "✓ Architecture diagrams generated"
          ls -lh Book_SSW590_1/architecture/ 2>/dev/null | tail -n +2 || echo "Diagrams ready for compilation"
      
      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science
      
      - name: Compile LaTeX to PDF
        run: |
          cd Book_SSW590_1
          
          # Run pdflatex multiple times for references and TOC
          echo "First pass: generating references..."
          pdflatex -interaction=nonstopmode -output-directory=. itManual.tex > build.log 2>&1 || true
          
          echo "Second pass: building table of contents..."
          pdflatex -interaction=nonstopmode -output-directory=. itManual.tex > build.log 2>&1 || true
          
          echo "Third pass: final compilation..."
          pdflatex -interaction=nonstopmode -output-directory=. itManual.tex > build.log 2>&1 || true
          
          # Check if PDF was created
          if [ -f itManual.pdf ]; then
              echo "✓ PDF generated successfully: itManual.pdf"
          else
              echo "✗ PDF generation failed"
              tail -50 build.log
              exit 1
          fi
      
      - name: Check build log for errors
        if: always()
        run: |
          cd Book_SSW590_1
          
          if grep -i "error\|undefined\|emergency stop" build.log; then
              echo "⚠ Warnings or errors found in build log (not critical)"
          else
              echo "✓ No critical errors in build log"
          fi
      
      - name: Generate build metadata JSON
        run: |
          cat > buildinfo.json << 'JSON'
          {
            "version": "$(cat Book_SSW590_1/version.txt)",
            "commitHash": "$(git rev-parse --short HEAD)",
            "commitMessage": "$(git log -1 --pretty=%B | head -1)",
            "author": "$(git log -1 --pretty=%an)",
            "timestamp": "$(git log -1 --pretty=%ai)",
            "branch": "$(git rev-parse --abbrev-ref HEAD)",
            "totalCommits": $(git rev-list --count HEAD),
            "buildDate": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "pdfPath": "Book_SSW590_1/itManual.pdf",
            "repository": "${{ github.repository }}",
            "workflowRun": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
          
          cat buildinfo.json
      
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaTeX-PDF-${{ github.run_id }}
          path: Book_SSW590_1/itManual.pdf
          retention-days: 30
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build-Metadata-${{ github.run_id }}
          path: |
            buildinfo.json
            Book_SSW590_1/version.txt
            Book_SSW590_1/buildinfo.tex
          retention-days: 30

  test:
    name: Automated Tests
    runs-on: self-hosted
    needs: build
    steps:
      - name: Show commit info
        run: |
          echo "Commit SHA: $GITHUB_SHA"
          echo "Commit Message:"
          git log -1 --pretty=%B

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System Load - Test Start
        run: |
          echo "=== SYSTEM METRICS - TEST START ==="
          iostat -x 1 2 || echo "iostat not available"
          vmstat 1 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install testing tools
        run: |
          npm install -g htmlhint stylelint eslint --save-dev
          echo "Testing tools installed"

      - name: HTML validation
        run: |
          echo "=== HTML Validation ==="
          if command -v htmlhint &> /dev/null; then
            htmlhint index.html || echo "Note: HTML hints found (non-blocking)"
          fi
          if grep -q "<!DOCTYPE" index.html && grep -q "<html" index.html; then
            echo "✓ HTML structure valid"
          else
            echo "✗ HTML structure invalid"
            exit 1
          fi

      - name: CSS validation
        run: |
          echo "=== CSS Syntax Check ==="
          if [ -f style.css ]; then
            if grep -E "^\s*[a-z-]+\s*:" style.css > /dev/null; then
              echo "✓ CSS file has valid declarations"
            else
              echo "✗ CSS validation failed"
              exit 1
            fi
          fi

      - name: JavaScript syntax check
        run: |
          echo "=== JavaScript Syntax Check ==="
          for js_file in demo.js; do
            if [ -f "$js_file" ]; then
              node -c "$js_file" && echo "✓ $js_file syntax OK" || exit 1
            fi
          done

      - name: Smoke test - serve and validate
        run: |
          npm install -g http-server
          npx http-server -p 8080 &>/dev/null &
          SERVER_PID=$!
          sleep 2
          
          for i in {1..10}; do
            if curl -fsS http://localhost:8080 >/dev/null 2>&1; then
              echo "✓ Server is responding"
              break
            fi
            sleep 1
          done
          
          content=$(curl -fsS http://localhost:8080/ || echo "")
          if echo "$content" | grep -qi "html\|DOCTYPE"; then
            echo "✓ HTML content served correctly"
          else
            echo "✗ Server did not return valid HTML"
            kill $SERVER_PID || true
            exit 1
          fi
          
          kill $SERVER_PID || true
          echo "✓ All smoke tests passed"

      - name: System Load - Test End
        run: |
          echo "=== SYSTEM METRICS - TEST END ==="
          echo "CPU Info:"
          nproc --all
          echo ""
          echo "Memory Usage:"
          free -h | awk 'NR==2{print "Used: " $3 " / Total: " $2}'

  package-and-release:
    name: Create Release Artifact
    runs-on: self-hosted
    needs: [ build, build-latex, test ]
    steps:
      - name: Show commit info
        run: |
          echo "Commit SHA: $GITHUB_SHA"
          echo "Commit Message:"
          git log -1 --pretty=%B

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System Load - Final
        run: |
          echo "=== SYSTEM METRICS - FINAL ==="
          uptime
          free -h
          df -h /

      - name: Download artifact metadata
        run: |
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Artifact: ${{ needs.build.outputs.artifact-name }}"

      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: LaTeX-PDF-${{ github.run_id }}
          path: ./latex-artifacts

      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          name: Build-Metadata-${{ github.run_id }}
          path: ./build-metadata

      - name: Create comprehensive deployment package
        run: |
          VERSION=${{ needs.build.outputs.version }}
          PACKAGE_NAME="devops-final-project-${VERSION}"
          
          echo "=== Creating comprehensive package: ${PACKAGE_NAME}.zip ==="
          zip -r "${PACKAGE_NAME}.zip" \
            index.html \
            style.css \
            demo.js \
            README.md \
            .github/workflows/ci-cd.yml \
            -x "node_modules/*" ".git/*"
          
          # Add PDF if it exists
          if [ -f ./latex-artifacts/itManual.pdf ]; then
            zip -u "${PACKAGE_NAME}.zip" ./latex-artifacts/itManual.pdf
            echo "✓ Added PDF to package"
          fi
          
          # Add build metadata if it exists
          if [ -f ./build-metadata/buildinfo.json ]; then
            zip -u "${PACKAGE_NAME}.zip" ./build-metadata/buildinfo.json
            echo "✓ Added build metadata to package"
          fi
          
          ls -lh "${PACKAGE_NAME}.zip"
          echo "ARTIFACT_PATH=${PACKAGE_NAME}.zip" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload comprehensive artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: devops-final-project-${{ needs.build.outputs.version }}
          path: devops-final-project-${{ needs.build.outputs.version }}.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            devops-final-project-${{ needs.build.outputs.version }}.zip
            ./latex-artifacts/itManual.pdf
            ./build-metadata/buildinfo.json
          tag_name: v${{ needs.build.outputs.version }}
          name: Release ${{ needs.build.outputs.version }}
          body: |
            ## Deployment Artifact v${{ needs.build.outputs.version }}
            
            **Build Details:**
            - Version: ${{ needs.build.outputs.version }}
            - Artifact: devops-final-project-${{ needs.build.outputs.version }}.zip
            
            **Tests Status:** ✅ All passed
            **LaTeX Build:** ✅ PDF generated successfully
            
            This artifact contains:
            - Complete website ready for deployment
            - LaTeX-generated PDF documentation (itManual.pdf)
            - Build metadata and version information
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version updates (if changed)
        if: always()
        run: |
          cd ${{ github.workspace }}
          
          git add Book_SSW590_1/version.txt Book_SSW590_1/buildinfo.tex ./build-metadata/buildinfo.json 2>/dev/null || true
          
          if git diff --cached --quiet; then
              echo "No changes to commit"
          else
              git commit -m "ci: auto-update version and build info [skip ci]" || true
              git push origin ${{ github.ref_name }} || true
          fi
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "=== Build Summary ==="
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Web Package: devops-final-project-${{ needs.build.outputs.version }}.zip"
          echo "PDF Location: latex-artifacts/itManual.pdf"
          echo ""
          echo "View all artifacts in the artifacts section above"